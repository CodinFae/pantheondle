[project]
name = "pantheondle"
version = "0.1.0"
description = "Play with Pantheon.world data and try to guess who is the famous person depicted"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "nicegui>=3.15.0",
    "pandas[parquet]>=2.3.3"
]


[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/pantheondle"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "N", "UP", "B", "SIM", "RUF", "PTH", "ANN", "T20"]

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["ANN"]

[tool.basedpyright]
typeCheckingMode = "strict"
reportUnusedCallResult = false

[dependency-groups]
dev = [
    "basedpyright>=1.39.10",
    "deptry>=0.25.1",
    "ruff>=0.16.1",
    "pandas-stubs>=3.0.5.260730",   # type stubs — check-time only, was in runtime deps
]

[tool.deptry]
known_first_party = ["pantheondle"]


[project.scripts]
pantheondle = "pantheondle.main:main"
pantheondle-prepare-data = "pantheondle.scripts.prepare_data:main"
