[project]
name = "pantheondle"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "basemap>=2.0.0",
    "matplotlib>=3.9.4",
    "nicegui>=3.15.0",
    "numpy>=2.0.2",
    "pandas>=2.3.3",
    "streamlit>=1.50.0",
]


[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/pantheondle"]

[dependency-groups]
dev = [
    "ruff>=0.16.1",
]
